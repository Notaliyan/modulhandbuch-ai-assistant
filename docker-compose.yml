# ===========================================================================
# Full-stack RAG application — Modulhandbuch AI Assistant
# ===========================================================================
# Brings up the whole stack with a single command:
#     docker compose up --build
#
# Services
#   backend  — FastAPI + LangChain + ChromaDB, exposed on host port 8000
#   frontend — Next.js 15 production server, exposed on host port 3000
# ===========================================================================

services:
  # -------------------------------------------------------------------------
  # Backend: FastAPI RAG API
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      # host:container — lets you reach the API directly at localhost:8000
      # (e.g. /docs, /api/health) for debugging.
      - "8000:8000"
    env_file:
      # Supplies OPENAI_API_KEY (and any other settings) at runtime.
      # This file is git-ignored and never baked into the image.
      - ./backend/.env
    volumes:
      # Bind-mount the already-populated data directory. The container
      # reuses the existing ChromaDB store and PDF — nothing is re-ingested.
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Frontend: Next.js chat UI
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # IMPORTANT: this is the URL the BROWSER uses, not the container.
        # The browser runs on the host, so it must reach the backend via
        # the host-published port. See the explanation in the chat reply.
        NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
    container_name: rag-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        # Wait until the backend healthcheck passes before starting.
        condition: service_healthy
    restart: unless-stopped

# Note: no top-level `volumes:` block is needed — the backend uses a bind
# mount to ./backend/data, so the data lives in your repo on the host and
# persists naturally across `docker compose down` / `up`.
